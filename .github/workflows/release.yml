name: Build & Release installer

# Push a version tag (e.g. `git tag v1.2.3 && git push --tags`) to build the
# Windows installer and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoPriceAlert-installer
          path: installer_output/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/*.exe
          generate_release_notes: true
