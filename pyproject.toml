[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-price-alert"
version = "1.3.1"
description = "Free desktop price alert widget for Windows — crypto (Bitcoin, altcoins, Binance spot/futures, CoinGecko) and stocks (US + Indian NSE/BSE via Yahoo Finance), with desktop notifications and a system-tray widget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "crypto", "cryptocurrency", "price-alert", "price-alerts", "bitcoin", "ethereum",
    "altcoin", "binance", "coingecko", "binance-futures", "desktop-widget",
    "system-tray", "notifications", "websocket", "trading-tools", "windows", "pyside6",
    "stock-alert", "stock-price-alert", "nse", "bse", "yahoo-finance", "indian-stocks",
    "us-stocks",
]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
    "pywin32>=306 ; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/volumeradar01/crypto-price-alert-widget"
Source = "https://github.com/volumeradar01/crypto-price-alert-widget"
Issues = "https://github.com/volumeradar01/crypto-price-alert-widget/issues"
Releases = "https://github.com/volumeradar01/crypto-price-alert-widget/releases"

[project.gui-scripts]
crypto-price-alert = "crypto_price_alert.__main__:main"

[tool.setuptools]
packages = ["crypto_price_alert"]
